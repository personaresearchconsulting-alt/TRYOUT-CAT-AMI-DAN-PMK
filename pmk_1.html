<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CAT PMK PERSONALITY INVENTORY - Persona Research & Consulting</title>
<style>
:root{
--primary:#0A1128;
--deep-space:#1C2541;
--accent:#C5A880;
--bg:#F4F5F7;
--white:#FFFFFF;
--success:#27AE60;
--danger:#E74C3C;
--warning:#E67E22;
--premium-gray:#5C677D;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{background:var(--primary);color:var(--accent);padding:.8rem;text-align:center;border-bottom:4px solid var(--accent);font-weight:800;font-size:1.2rem;letter-spacing:2px;text-transform:uppercase}
#login-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--white);padding:40px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.08);width:100%;max-width:450px;text-align:center;border-top:5px solid var(--accent)}
.login-card h2{color:var(--primary);font-size:1.6rem;margin-bottom:5px;font-weight:700}
.login-sub{color:var(--premium-gray);font-size:.85rem;margin-bottom:25px;text-transform:uppercase;letter-spacing:1px}
.login-card input{width:100%;padding:14px;margin-bottom:20px;border:1.5px solid #E2E8F0;border-radius:6px;font-size:16px;outline:none;background:#F8FAFC;color:var(--primary)}
.main-container{display:none;flex-direction:column;max-width:980px;margin:15px auto;padding:0 15px;width:100%;gap:15px}
.content-area{background:var(--white);padding:25px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.04);display:flex;flex-direction:column}
.meta-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #E2E8F0;font-size:.8rem;font-weight:600;color:var(--premium-gray)}
.tier-badge{background:var(--primary);color:var(--accent);padding:3px 8px;border-radius:4px;font-weight:700;font-size:.7rem;text-transform:uppercase}
.q-text{font-size:1.05rem;font-weight:600;color:var(--primary);margin-bottom:20px;line-height:1.8;text-align:justify}
.likert-wrapper{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}
.likert-option{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;border:1.5px solid #E2E8F0;border-radius:10px;cursor:pointer;transition:.2s;background:#F8FAFC;min-height:78px;text-align:center}
.likert-option:hover{border-color:var(--accent);background:#FFFDF5;transform:translateY(-2px)}
.likert-option.selected{border-color:var(--primary);background:#EEF2FF;border-width:2px}
.scale-num{display:none}
.likert-option.selected .scale-num{background:var(--accent);color:var(--primary)}
.scale-text{font-size:.8rem;font-weight:600;color:var(--primary)}
.sidebar{background:var(--white);padding:20px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.04);border-top:4px solid var(--accent);margin-bottom:30px}
.summary-box{background:#F8FAFC;border:1px solid #E2E8F0;padding:12px;border-radius:6px;font-size:.8rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--primary)}
.progress-wrap{width:100%;height:12px;background:#E2E8F0;border-radius:20px;overflow:hidden;margin-top:10px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.3s}
.nav-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.nav-dot{padding:10px 0;text-align:center;background:#F1F5F9;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700;border:1px solid #E2E8F0;color:var(--primary)}
.nav-dot.current{border:2px solid var(--accent);background:#FFFDF5}
.nav-dot.filled{background:var(--primary);color:var(--accent)}
.btn{padding:12px 18px;border:none;border-radius:6px;cursor:pointer;font-weight:700;text-transform:uppercase;width:100%;font-size:.85rem;letter-spacing:.5px}
.btn-primary{background:var(--primary);color:var(--accent)}
.btn-success{background:var(--success);color:white}
#timer-box{font-weight:800;color:var(--danger)}
#result-screen{display:none;padding:40px 20px;text-align:center;max-width:1000px;margin:0 auto}
.review-card{background:white;padding:14px 16px;margin-bottom:10px;border-radius:8px;text-align:left;border-left:6px solid var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.04);line-height:1.45}
@media(max-width:768px){
.likert-wrapper{grid-template-columns:repeat(2,1fr)}
.nav-grid{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>

const likertScale=[
{val:1,text:'Sangat Tidak Sesuai'},
{val:2,text:'Tidak Sesuai'},
{val:3,text:'Ragu-ragu'},
{val:4,text:'Sesuai'},
{val:5,text:'Sangat Sesuai'}
];

let activeQuestions=[];
let currentIdx=0;
let userAnswers={};
let timer=2700;
let violationCount=0;
let blurCount=0;
let rapidAnswerCount=0;
let answerTimestamps=[];
let timerInterval;

function startAssessment(){
preventReloadExit();
startBehaviorMonitoring();
loadAutosave();
const name=document.getElementById('student-name').value.trim();
if(!name)return alert('Masukkan nama peserta');
document.getElementById('meta-name').innerText=name.toUpperCase();
activeQuestions=[...masterData].sort(()=>Math.random()-0.5);
document.getElementById('login-screen').style.display='none';
document.getElementById('main-cat-screen').style.display='flex';
buildNavGrid();
renderQuestion();
startTimer();
}

function startTimer(){
timerInterval=setInterval(()=>{
timer--;
let m=Math.floor(timer/60).toString().padStart(2,'0');
let s=(timer%60).toString().padStart(2,'0');
document.getElementById('timer-box').innerText=`${m}:${s}`;
if(timer<=0){clearInterval(timerInterval);evaluateAndSubmit();}
},1000);
}

function renderQuestion(){
const q=activeQuestions[currentIdx];
document.getElementById('current-q-num').innerText=`Pernyataan ${currentIdx+1} dari ${activeQuestions.length}`;
document.getElementById('dimensi-badge').innerText=q.dim;
document.getElementById('stem-container').innerText=q.stem;
const wrapper=document.getElementById('options-wrapper');
wrapper.innerHTML='';
const shuffled=[...likertScale].sort(()=>Math.random()-.5);
shuffled.forEach(scale=>{
const opt=document.createElement('div');
opt.className=`likert-option ${userAnswers[q.id]===scale.val?'selected':''}`;
opt.innerHTML=`<div class='scale-num'>${scale.val}</div><div class='scale-text'>${scale.text}</div>`;
opt.onclick=()=>selectScaleValue(q.id,scale.val);
wrapper.appendChild(opt);
});
updateProgress();
}

function selectScaleValue(qId,val){
const now=Date.now();
answerTimestamps.push(now);
if(answerTimestamps.length>1){
const delta=now-answerTimestamps[answerTimestamps.length-2];
if(delta<800) rapidAnswerCount++;
}
localStorage.setItem('pmk_autosave',JSON.stringify(userAnswers));
userAnswers[qId]=val;
syncNavGridState();
renderQuestion();
setTimeout(()=>{
if(currentIdx<activeQuestions.length-1){currentIdx++;renderQuestion();}
},180);
}

function buildNavGrid(){
const grid=document.getElementById('nav-grid');
grid.innerHTML='';
activeQuestions.forEach((q,idx)=>{
const dot=document.createElement('div');
dot.className='nav-dot';
dot.id=`nav-${idx}`;
dot.innerText=idx+1;
dot.onclick=()=>{currentIdx=idx;renderQuestion();syncNavGridState();};
grid.appendChild(dot);
});
syncNavGridState();
}

function syncNavGridState(){
let answered=0;
activeQuestions.forEach((q,idx)=>{
const el=document.getElementById(`nav-${idx}`);
el.className='nav-dot';
if(idx===currentIdx)el.classList.add('current');
if(userAnswers[q.id]){el.classList.add('filled');answered++;}
});
document.getElementById('answeredCount').innerText=answered;
}

function updateProgress(){
const answered=Object.keys(userAnswers).length;
document.getElementById('progress-bar').style.width=`${(answered/50)*100}%`;
}

function prevQuestion(){if(currentIdx>0){currentIdx--;renderQuestion();syncNavGridState();}}
function nextQuestion(){if(currentIdx<49){currentIdx++;renderQuestion();syncNavGridState();}}

function triggerDirectSubmit(){
if(Object.keys(userAnswers).length<50){
if(!confirm('Masih ada item yang belum dijawab. Lanjut proses hasil?')) return;
}
evaluateAndSubmit();
}

function evaluateAndSubmit(){
// Behavioral validity simulation layer
let responseTimes=[];
let hiddenRiskIndex=0;
let defensivePattern=0;
let adaptiveConsistency=0;
clearInterval(timerInterval);
let total=0;
let dimensi={};
let redFlags=[];
let consistency=[];
let review='';

activeQuestions.forEach((q,idx)=>{
let ans=userAnswers[q.id]||3;
let score=q.key>=4?ans:(6-ans);
if(q.flag==='RV'||q.flag==='RF')score=6-ans;
if(q.flag==='RF'&&ans>=4){redFlags.push(q.id);hiddenRiskIndex+=2;}
if(q.flag==='FG'&&ans>=4)adaptiveConsistency++;
if(q.flag==='RV'&&ans>=4)defensivePattern++;
if(!dimensi[q.dim])dimensi[q.dim]=[];
dimensi[q.dim].push(score);
total+=score;
const ideal=q.key;
review+=`<div class='review-card'>
<b>Soal ${idx+1}</b><br><br>
<div><b>Soal:</b> ${q.stem}</div>
<div style='margin-top:6px'><b>Jawaban Anda:</b> ${likertScale.find(l=>l.val===ans)?.text || ans}</div>
<div><b>Jawaban Ideal:</b> ${likertScale.find(l=>l.val===ideal)?.text || ideal}</div>
<div><b>Pembahasan:</b> ${q.explanation}</div>
<div><b>Skor:</b> ${score}/5</div>
</div>`;
});

if(Math.abs((userAnswers[11]||3)-(userAnswers[50]||3))>=3){
consistency.push('Terdapat perbedaan signifikan pada item perilaku konsistensi kerja.');
}

let dimHTML=`
<div class='review-card' style='padding:15px'>
<table style='width:100%;border-collapse:collapse;font-size:.88rem'>
<thead>
<tr style='background:var(--primary);color:var(--accent)'>
<th style='padding:6px 8px;border:1px solid #E2E8F0;text-align:left'>Dimensi</th>
<th style='padding:6px 8px;border:1px solid #E2E8F0'>Rata-rata</th>
<th style='padding:6px 8px;border:1px solid #E2E8F0'>Kategori</th>
</tr>
</thead>
<tbody>`;
Object.keys(dimensi).forEach(d=>{
let avg=(dimensi[d].reduce((a,b)=>a+b,0)/dimensi[d].length).toFixed(1);
let cat=avg>=4?'Adaptif':avg>=3?'Cukup Stabil':'Perlu Evaluasi';
dimHTML+=`
<tr>
<td style='padding:6px 8px;border:1px solid #E2E8F0'>${d}</td>
<td style='padding:6px 8px;border:1px solid #E2E8F0;text-align:center'>${avg}</td>
<td style='padding:6px 8px;border:1px solid #E2E8F0;text-align:center'>${cat}</td>
</tr>`;
});
dimHTML+=`</tbody></table></div>`;

let extra=`<div class='review-card' style='max-width:780px;margin:0 auto 15px auto'><b>Indikator Red Flag:</b><br>${redFlags.length?redFlags.join(', '):'Tidak terdeteksi indikator dominan.'}</div>`;
extra+=`<div class='review-card' style='max-width:780px;margin:0 auto 15px auto'><b>Catatan Konsistensi Jawaban:</b><br>${consistency.length?consistency.join('<br>'):'Respons relatif konsisten.'}</div>`;
extra+=`<div class='review-card' style='max-width:780px;margin:0 auto 15px auto'>
<b>Audit Aktivitas Peserta</b><br>
Deteksi perpindahan tab: ${blurCount}<br>
Indikasi jawaban terlalu cepat: ${rapidAnswerCount}<br>
Indeks pelanggaran sesi: ${violationCount}
</div>`;

let pct=((total/250)*100).toFixed(0);
let profileStatus='STABIL';
if(hiddenRiskIndex>=4||defensivePattern>=8) profileStatus='PERLU OBSERVASI LANJUT';
if(hiddenRiskIndex>=8) profileStatus='INDIKATOR RISIKO MENINGKAT';
document.getElementById('main-cat-screen').style.display='none';
document.getElementById('result-screen').style.display='block';
document.getElementById('res-name').innerHTML=`LAPORAN PROFIL PERILAKU PROFESIONAL<br><span style='font-size:1rem'>${document.getElementById('student-name').value.toUpperCase()} • ${pct}%</span><br><span style='font-size:.9rem;color:var(--accent)'>STATUS PROFIL: ${profileStatus}</span>`;
document.getElementById('dimensi-score-list').innerHTML=dimHTML+extra;
document.getElementById('review-list').innerHTML=review;
window.scrollTo(0,0);
}

function activateFullscreen(){
const el=document.documentElement;
if(el.requestFullscreen){el.requestFullscreen();}
}

function preventReloadExit(){
window.onbeforeunload=function(){return 'Sistem asesmen masih berjalan';}
window.addEventListener('keydown',function(e){
if(e.key==='F5'||(e.ctrlKey&&e.key==='r')){
e.preventDefault();
}
});
}

function startBehaviorMonitoring(){
document.addEventListener('visibilitychange',()=>{
if(document.hidden){
blurCount++;
violationCount++;
}
});
window.addEventListener('blur',()=>{
blurCount++;
});
}

}
}
